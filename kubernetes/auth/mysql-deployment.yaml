apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-auth-initdb
  labels:
    app: mysql-auth
    owner: rakha
data:
  auth_db.sql: |
    CREATE DATABASE IF NOT EXISTS auth_db;
    USE auth_db;

    CREATE TABLE IF NOT EXISTS users (
      id INT PRIMARY KEY AUTO_INCREMENT,
      nama VARCHAR(100) NOT NULL,
      email VARCHAR(100) UNIQUE NOT NULL,
      password VARCHAR(255) NOT NULL,
      nomor_telepon VARCHAR(20),
      alamat TEXT,
      role ENUM('admin', 'user') NOT NULL DEFAULT 'user',
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO users (nama, email, password, nomor_telepon, alamat, role) VALUES
    ('Admin SmileOn', 'admin@smileon.com', '$2b$10$xPQ5Z6Z6Z6Z6Z6Z6Z6Z6ZuKJ8qK8qK8qK8qK8qK8qK8qK8qK8qK', '081234567890', 'Jl. Admin No. 1, Jakarta', 'admin');

    INSERT INTO users (nama, email, password, nomor_telepon, alamat, role) VALUES
    ('Budi Santoso', 'budi@email.com', '$2b$10$yRQ6A7A7A7A7A7A7A7A7AuLK9rL9rL9rL9rL9rL9rL9rL9rL9rL9r', '082345678901', 'Jl. Merdeka No. 10, Bandung', 'user');

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-auth
  labels:
    app: mysql-auth
    owner: rakha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-auth
  template:
    metadata:
      labels:
        app: mysql-auth
    spec:
      containers:
        - name: mysql-auth
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "auth_db"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-auth-storage
              mountPath: /var/lib/mysql
            - name: mysql-auth-initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: mysql-auth-storage
          persistentVolumeClaim:
            claimName: mysql-auth-pvc
        - name: mysql-auth-initdb
          configMap:
            name: mysql-auth-initdb
