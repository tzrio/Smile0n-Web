apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-product-initdb
  labels:
    app: mysql-product
    owner: rakha
data:
  product_db.sql: |
    CREATE DATABASE IF NOT EXISTS product_db;
    USE product_db;

    CREATE TABLE IF NOT EXISTS products (
      id INT PRIMARY KEY AUTO_INCREMENT,
      nama_produk VARCHAR(150) NOT NULL,
      kategori VARCHAR(100),
      deskripsi TEXT,
      harga DECIMAL(12, 2) NOT NULL,
      gambar VARCHAR(255),
      estimasi_pengerjaan VARCHAR(50),
      status_ketersediaan ENUM('tersedia', 'tidak_tersedia') NOT NULL DEFAULT 'tersedia',
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO products (nama_produk, kategori, deskripsi, harga, gambar, estimasi_pengerjaan, status_ketersediaan) VALUES
    ('Desain Logo', 'Logo', 'Desain logo profesional', 500000.00, 'images/logo-design.jpg', '3-5 hari', 'tersedia'),
    ('Desain Banner', 'Banner', 'Desain banner promosi', 300000.00, 'images/banner-design.jpg', '2-3 hari', 'tersedia'),
    ('Desain Kemasan', 'Packaging', 'Desain kemasan produk', 750000.00, 'images/packaging-design.jpg', '5-7 hari', 'tersedia');

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-product
  labels:
    app: mysql-product
    owner: rakha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-product
  template:
    metadata:
      labels:
        app: mysql-product
    spec:
      containers:
        - name: mysql-product
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "product_db"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-product-storage
              mountPath: /var/lib/mysql
            - name: mysql-product-initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: mysql-product-storage
          persistentVolumeClaim:
            claimName: mysql-product-pvc
        - name: mysql-product-initdb
          configMap:
            name: mysql-product-initdb
