apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-payment-initdb
  labels:
    app: mysql-payment
    owner: roihan
data:
  payment_db.sql: |
    CREATE DATABASE IF NOT EXISTS payment_db;
    USE payment_db;

    CREATE TABLE IF NOT EXISTS payments (
      id INT PRIMARY KEY AUTO_INCREMENT,
      order_id INT NOT NULL,
      user_id INT NOT NULL,
      metode_pembayaran VARCHAR(100),
      jumlah DECIMAL(12, 2),
      bukti_pembayaran VARCHAR(255),
      status_verifikasi ENUM('menunggu_verifikasi', 'terverifikasi', 'ditolak') DEFAULT 'menunggu_verifikasi',
      tanggal_pembayaran TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      verified_at TIMESTAMP NULL
    );

    INSERT INTO payments (order_id, user_id, metode_pembayaran, jumlah, bukti_pembayaran, status_verifikasi) VALUES
    (1, 1, 'Transfer Bank BCA', 500000.00, 'uploads/bukti-transfer-001.jpg', 'menunggu_verifikasi');

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-payment
  labels:
    app: mysql-payment
    owner: roihan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-payment
  template:
    metadata:
      labels:
        app: mysql-payment
    spec:
      containers:
        - name: mysql-payment
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "payment_db"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-payment-storage
              mountPath: /var/lib/mysql
            - name: mysql-payment-initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: mysql-payment-storage
          persistentVolumeClaim:
            claimName: mysql-payment-pvc
        - name: mysql-payment-initdb
          configMap:
            name: mysql-payment-initdb
