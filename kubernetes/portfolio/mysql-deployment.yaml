apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-portfolio-initdb
  labels:
    app: mysql-portfolio
    owner: rakha
data:
  portfolio_db.sql: |
    CREATE DATABASE IF NOT EXISTS portfolio_db;
    USE portfolio_db;

    CREATE TABLE IF NOT EXISTS portfolios (
      id INT PRIMARY KEY AUTO_INCREMENT,
      judul VARCHAR(200) NOT NULL,
      kategori VARCHAR(100),
      deskripsi TEXT,
      gambar VARCHAR(255),
      tags VARCHAR(255),
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-portfolio
  labels:
    app: mysql-portfolio
    owner: rakha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-portfolio
  template:
    metadata:
      labels:
        app: mysql-portfolio
    spec:
      containers:
        - name: mysql-portfolio
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            - name: MYSQL_DATABASE
              value: "portfolio_db"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-portfolio-storage
              mountPath: /var/lib/mysql
            - name: mysql-portfolio-initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
      volumes:
        - name: mysql-portfolio-storage
          persistentVolumeClaim:
            claimName: mysql-portfolio-pvc
        - name: mysql-portfolio-initdb
          configMap:
            name: mysql-portfolio-initdb
