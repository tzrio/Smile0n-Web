# ============================================
# Kubernetes Service - Frontend Service
# ============================================
# Membuat Service agar frontend bisa diakses oleh gateway.
# Tipe ClusterIP: hanya bisa diakses dari dalam cluster.
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend-service
spec:
  type: ClusterIP
  selector:
    app: frontend-service
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
