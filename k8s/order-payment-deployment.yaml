# ============================================
# Kubernetes Deployment - Order-Payment Service
# ============================================
# File ini mendefinisikan bagaimana pod order-payment-service dijalankan.
# Pod ini berisi container Node.js yang menjalankan API pesanan & pembayaran.
#
# Environment variable:
#   DB_HOST     = nama Kubernetes Service untuk MySQL ("mysql-service")
#   DB_PORT     = port MySQL (3306)
#   DB_USER     = username database
#   DB_PASSWORD = password database
#   DB_NAME     = nama database yang digunakan
#   UPLOAD_DIR  = folder penyimpanan bukti pembayaran di dalam container
#   PORT        = port yang digunakan oleh Express server
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-payment-service
  labels:
    app: order-payment-service
spec:
  # Jumlah pod yang dijalankan (1 replica cukup untuk development)
  replicas: 1
  selector:
    matchLabels:
      app: order-payment-service
  template:
    metadata:
      labels:
        app: order-payment-service
    spec:
      containers:
        - name: order-payment-service
          # Nama Docker image yang sudah di-build
          image: smileon-order-payment-service:latest
          ports:
            - containerPort: 3000
          # Environment variable untuk koneksi database dan konfigurasi
          env:
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "rootpassword"
            - name: DB_NAME
              value: "smileon_db"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: PORT
              value: "3000"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
