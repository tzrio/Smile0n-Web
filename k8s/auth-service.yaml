# ============================================
# Kubernetes Service - Auth Service
# ============================================
# Membuat Service agar auth-service bisa diakses oleh gateway.
# Tipe ClusterIP: hanya bisa diakses dari dalam cluster.
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
