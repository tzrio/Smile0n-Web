# ============================================
# Kubernetes Deployment - Gateway Service (Nginx)
# ============================================
# File ini menjalankan pod Nginx yang berfungsi sebagai API Gateway.
# Gateway menerima semua request dari user dan meneruskannya
# ke service backend yang sesuai berdasarkan URL path.
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: smileon-gateway-service:latest
          ports:
            # Nginx menerima request di port 80
            - containerPort: 80
