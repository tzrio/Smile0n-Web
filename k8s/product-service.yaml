# ============================================
# Kubernetes Service - Product Service
# ============================================
# Membuat Service agar product-service bisa diakses oleh gateway.
# Tipe ClusterIP: hanya bisa diakses dari dalam cluster.
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
