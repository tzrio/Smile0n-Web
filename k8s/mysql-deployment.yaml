---
# ============================================
# PersistentVolumeClaim: Penyimpanan data MySQL
# ============================================
# Agar data database tidak hilang saat pod MySQL di-restart
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    app: mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ============================================
# Deployment: Menjalankan container MySQL 8.0
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            # Password root MySQL
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"
            # Database yang otomatis dibuat saat pertama kali start
            - name: MYSQL_DATABASE
              value: "smileon_db"
          volumeMounts:
            # Mount PVC untuk data MySQL (agar persisten)
            - name: mysql-data
              mountPath: /var/lib/mysql
            # Mount ConfigMap init.sql ke folder inisialisasi MySQL
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        # Volume dari PVC untuk data MySQL
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        # Volume dari ConfigMap yang berisi init.sql
        - name: mysql-init
          configMap:
            name: mysql-init-config
