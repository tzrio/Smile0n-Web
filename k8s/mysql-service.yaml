# ============================================
# Kubernetes Service - MySQL Database
# ============================================
# File ini membuat Service agar pod MySQL bisa diakses oleh service lain.
# Nama service "mysql-service" digunakan sebagai DB_HOST di environment variable
# semua backend service (auth, product, order-payment).
#
# Tipe ClusterIP: hanya bisa diakses dari dalam cluster (tidak dari luar).
# Ini aman karena database tidak perlu diakses langsung dari internet.
# ============================================

apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306        # Port yang diexpose di dalam cluster
      targetPort: 3306  # Port container MySQL
      protocol: TCP
