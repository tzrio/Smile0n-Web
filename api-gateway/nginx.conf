# ============================================
# Konfigurasi Nginx - API Gateway SmileOn Lab
# Owner: Bagus
# ============================================
# File ini mengatur bagaimana Nginx meneruskan request dari user
# ke service backend yang sesuai di dalam cluster Kubernetes.
#
# Alur request:
#   User/Browser → Gateway (Nginx:80) → Service Backend
#
# Routing:
#   /                        → frontend:3000 (tampilan website)
#   /api/auth/               → auth-service:3000 (login, register)
#   /api/products/           → product-service:3000 (daftar produk)
#   /api/orders/             → order-service:3001 (pesanan)
#   /api/payments/           → payment-service:3002 (pembayaran)
#   /api/recommendations/    → recommendation-service:3003 (rekomendasi)
#   /api/portfolio/          → portfolio-service:3004 (portofolio)
# ============================================

events {
    worker_connections 1024;
}

http {
    # ============================================
    # UPSTREAM: Mendefinisikan alamat service backend
    # ============================================

    # Frontend service - menyajikan halaman website
    upstream frontend {
        server frontend:3000;
    }

    # Auth service - menangani login dan register
    upstream auth {
        server auth-service:3000;
    }

    # Product service - menangani data produk
    upstream product {
        server product-service:3000;
    }

    # Order service - menangani pesanan desain custom
    upstream order {
        server order-service:3001;
    }

    # Payment service - menangani pembayaran dan verifikasi
    upstream payment {
        server payment-service:3002;
    }

    # Recommendation service - menangani rekomendasi produk
    upstream recommendation {
        server recommendation-service:3003;
    }

    # Portfolio service - menangani data portofolio
    upstream portfolio {
        server portfolio-service:3004;
    }

    # ============================================
    # SERVER: Aturan routing request
    # ============================================
    server {
        # Gateway menerima request di port 80
        listen 80;
        server_name localhost;

        # Halaman utama → diteruskan ke frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Autentikasi → diteruskan ke auth-service
        location /api/auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Produk → diteruskan ke product-service
        location /api/products/ {
            proxy_pass http://product/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Pesanan → diteruskan ke order-service
        location /api/orders/ {
            proxy_pass http://order/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Pembayaran → diteruskan ke payment-service
        location /api/payments/ {
            proxy_pass http://payment/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Rekomendasi → diteruskan ke recommendation-service
        location /api/recommendations/ {
            proxy_pass http://recommendation/recommendations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Portofolio → diteruskan ke portfolio-service
        location /api/portfolio/ {
            proxy_pass http://portfolio/portfolio/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
