events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend-service:3000;
    }

    upstream auth {
        server auth-service:3000;
    }

    upstream product {
        server product-service:3000;
    }

    upstream order-payment {
        server order-payment-service:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth Service API
        location /api/auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Product Service API
        location /api/products/ {
            proxy_pass http://product/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Order-Payment Service API
        location /api/orders/ {
            proxy_pass http://order-payment/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payments/ {
            proxy_pass http://order-payment/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
