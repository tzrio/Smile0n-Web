# ============================================
# Konfigurasi Nginx - API Gateway SmileOn Lab
# ============================================
# File ini mengatur bagaimana Nginx meneruskan request dari user
# ke service backend yang sesuai di dalam cluster Kubernetes.
#
# Alur request:
#   User/Browser → Gateway (Nginx:80) → Service Backend (port 3000)
#
# Routing:
#   /              → frontend-service (tampilan website)
#   /api/auth/     → auth-service (login, register)
#   /api/products/ → product-service (daftar produk)
#   /api/orders/   → order-payment-service (pesanan)
#   /api/payments/ → order-payment-service (pembayaran)
# ============================================

events {
    # Jumlah maksimal koneksi bersamaan yang bisa ditangani
    worker_connections 1024;
}

http {
    # ============================================
    # UPSTREAM: Mendefinisikan alamat service backend
    # Nama service mengikuti nama Kubernetes Service
    # ============================================

    # Frontend service - menyajikan halaman website
    upstream frontend {
        server frontend-service:3000;
    }

    # Auth service - menangani login dan register
    upstream auth {
        server auth-service:3000;
    }

    # Product service - menangani data produk
    upstream product {
        server product-service:3000;
    }

    # Order-Payment service - menangani pesanan dan pembayaran
    upstream order-payment {
        server order-payment-service:3000;
    }

    # ============================================
    # SERVER: Aturan routing request
    # ============================================
    server {
        # Gateway menerima request di port 80
        listen 80;
        server_name localhost;

        # Halaman utama → diteruskan ke frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Autentikasi → diteruskan ke auth-service
        location /api/auth/ {
            proxy_pass http://auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Produk → diteruskan ke product-service
        location /api/products/ {
            proxy_pass http://product/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Pesanan → diteruskan ke order-payment-service
        location /api/orders/ {
            proxy_pass http://order-payment/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API Pembayaran → diteruskan ke order-payment-service
        location /api/payments/ {
            proxy_pass http://order-payment/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
